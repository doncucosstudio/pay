<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay JNL LaserWorx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EDIT THIS BLOCK ONLY — your payment handles live in CONFIG
   (see the <script> at the bottom of the file)
   ============================================================ */
:root{
  --bg:#E4E8E1; --surface:#F6F7F3; --ink:#1E2721; --muted:#5B665E; --line:#C9CFC6;
  --brass:#A9833A;
  --cash:#00C244; --zelle:#6D1ED4; --venmo:#008CFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A16; --surface:#1D2520; --ink:#E9EDE6; --muted:#9AA69D; --line:#2F3A33;
    --brass:#D2AC5F; --venmo:#2E9BFF;
  }
}
:root[data-theme="dark"]{
  --bg:#141A16; --surface:#1D2520; --ink:#E9EDE6; --muted:#9AA69D; --line:#2F3A33;
  --brass:#D2AC5F; --venmo:#2E9BFF;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:26rem;margin:0 auto;padding:2.5rem 1.25rem 2rem;display:flex;flex-direction:column;min-height:100%}

.mark{
  width:4.5rem;height:4.5rem;border-radius:50%;
  border:2px solid var(--brass);display:grid;place-items:center;margin-bottom:1.5rem;
  position:relative;
}
.mark::before,.mark::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--brass);opacity:.45;
  animation:ripple 2.4s ease-out 1 both;
}
.mark::after{inset:-20px;opacity:.2;animation-delay:.25s}
.mark span{font-weight:800;font-size:1.3rem;color:var(--brass);letter-spacing:-.02em}
@keyframes ripple{from{transform:scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.mark::before,.mark::after{animation:none}}

h1{font-size:clamp(2rem,9vw,2.6rem);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 .5rem}
.tag{color:var(--muted);font-size:1.05rem;line-height:1.45;margin:0 0 2rem}

.amount{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.25rem 1rem;margin-bottom:1.25rem}
.amount label{color:var(--muted);font-size:.95rem;white-space:nowrap}
.amount .cur{font-weight:600;font-size:1.4rem;color:var(--muted)}
.amount input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:600 1.4rem/1 inherit;padding:.8rem 0;outline:none}
.amount:focus-within{border-color:var(--brass)}

.pay{display:flex;flex-direction:column;gap:.75rem}
.btn{
  display:flex;align-items:center;gap:1rem;width:100%;
  padding:1.05rem 1.15rem;border-radius:14px;border:0;cursor:pointer;
  font:600 1.15rem/1.2 inherit;color:#fff;text-decoration:none;text-align:left;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.btn small{display:block;font-weight:400;font-size:.85rem;opacity:.85;margin-top:.15rem}
.btn .ico{width:2.25rem;height:2.25rem;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:none}
.cash{background:var(--cash)} .zelle{background:var(--zelle)} .venmo{background:var(--venmo)}

.sheet{
  overflow:hidden;max-height:0;transition:max-height .3s ease;
  background:var(--surface);border-radius:14px;margin-top:-.4rem;
}
.sheet.open{max-height:22rem;border:1.5px solid var(--line)}
.sheet-in{padding:1.1rem 1.15rem}
.sheet p{margin:0 0 .75rem;color:var(--muted);line-height:1.45;font-size:.95rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.6rem 0;border-top:1px solid var(--line)}
.row b{font-weight:600;word-break:break-all}
.row em{font-style:normal;color:var(--muted);font-size:.85rem;display:block}
.copy{flex:none;border:1.5px solid var(--zelle);background:transparent;color:var(--ink);border-radius:10px;padding:.45rem .8rem;font:600 .9rem inherit;cursor:pointer}
.copy:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

footer{margin-top:auto;padding-top:2.5rem;color:var(--muted);font-size:.85rem;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1rem);opacity:0;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-weight:600;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span id="initials">JNL</span></div>
  <h1 id="biz">JNL LaserWorx</h1>
  <p class="tag" id="tagline">Thanks for supporting a small shop. Pick how you'd like to pay.</p>

  <div class="amount">
    <label for="amt">Amount</label>
    <span class="cur">$</span>
    <input id="amt" type="text" inputmode="decimal" placeholder="Optional" autocomplete="off">
  </div>

  <div class="pay">
    <a class="btn cash" id="cashBtn" href="#" rel="noopener">
      <span class="ico">$</span>
      <span>Pay with Cash App<small id="cashLabel"></small></span>
    </a>

    <button class="btn zelle" id="zelleBtn" aria-expanded="false" aria-controls="zelleSheet">
      <span class="ico">Z</span>
      <span>Pay with Zelle<small>Show my Zelle info</small></span>
    </button>
    <div class="sheet" id="zelleSheet" role="region" aria-label="Zelle details">
      <div class="sheet-in">
        <p>Zelle doesn't open from a link. Copy my info below, then open your bank's app and send with Zelle.</p>
        <div id="zelleRows"></div>
      </div>
    </div>

    <a class="btn venmo" id="venmoBtn" href="#" rel="noopener">
      <span class="ico">V</span>
      <span>Pay with Venmo<small id="venmoLabel"></small></span>
    </a>
  </div>

  <footer id="foot">Tap a button and your payment app opens with my info filled in.</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================== EDIT YOUR INFO HERE ================== */
const CONFIG = {
  business: "JNL LaserWorx",
  initials: "JNL",
  tagline:  "Thanks for supporting a small shop. Pick how you'd like to pay.",
  cashtag:  "$JuanGuz82",        // include the $
  venmo:    "Jnlguzman",       // your Venmo username, without the @
  zelle: {
    name:  "Juan Guzman",        // name as it shows in Zelle
    email: "latinusmaximus01@gmail.com",      // leave "" to hide
  }
};
/* ========================================================= */

const $ = id => document.getElementById(id);
document.title = "Pay " + CONFIG.business;
$("biz").textContent = CONFIG.business;
$("initials").textContent = CONFIG.initials;
$("tagline").textContent = CONFIG.tagline;
$("cashLabel").textContent = CONFIG.cashtag;
$("venmoLabel").textContent = "@" + CONFIG.venmo.replace(/^@/, "");

const tag = CONFIG.cashtag.replace(/^\$/, "");
function amount(){
  const v = parseFloat($("amt").value.replace(/[^0-9.]/g, ""));
  return v > 0 ? v.toFixed(2).replace(/\.00$/, "") : "";
}
function updateLinks(){
  const a = amount();
  $("cashBtn").href = "https://cash.app/$" + tag + (a ? "/" + a : "");
  $("venmoBtn").href = "https://venmo.com/?txn=pay&recipients=" + encodeURIComponent(CONFIG.venmo.replace(/^@/, "")) + (a ? "&amount=" + a : "");
}
$("amt").addEventListener("input", updateLinks);
updateLinks();

// Zelle details
const rows = [["Name", CONFIG.zelle.name], ["Email", CONFIG.zelle.email], ["Phone", CONFIG.zelle.phone]]
  .filter(r => r[1]);
$("zelleRows").innerHTML = rows.map((r, i) =>
  `<div class="row"><div><em>${r[0]}</em><b>${r[1]}</b></div>` +
  (r[0] === "Name" ? "" : `<button class="copy" data-v="${r[1]}">Copy</button>`) + `</div>`
).join("");

$("zelleBtn").addEventListener("click", () => {
  const s = $("zelleSheet"), open = !s.classList.contains("open");
  s.classList.toggle("open", open);
  $("zelleBtn").setAttribute("aria-expanded", open);
});

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600);
}
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const v = b.dataset.v;
  try { await navigator.clipboard.writeText(v); }
  catch {
    const ta = document.createElement("textarea"); ta.value = v; document.body.appendChild(ta);
    ta.select(); try { document.execCommand("copy"); } catch {} ta.remove();
  }
  b.textContent = "Copied"; toast("Copied " + v);
  setTimeout(() => b.textContent = "Copy", 1600);
});
</script>
</body>
</html>
